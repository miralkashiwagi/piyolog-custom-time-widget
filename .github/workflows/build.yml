name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-piyolog-time-widget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: piyolog-time-widget-release-apk
          path: app/build/outputs/apk/release/app-piyolog-time-widget.apk
